name: PinballPokedex
options:
  bundleIdPrefix: com.pinballpokedex
  deploymentTarget:
    macOS: "13.0"
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    DEVELOPMENT_TEAM: ""
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGNING_ALLOWED: "NO"
targets:
  PinballPokedex:
    type: application
    platform: macOS
    sources:
      - path: PinballPokedex
      - path: Resources/pokedex.json
        buildPhase: resources
      - path: Resources/sprites
        type: folder
        buildPhase: resources
      - path: Resources/portraits
        type: folder
        buildPhase: resources
      - path: Resources/ecards
        type: folder
        buildPhase: resources
      - path: scripts/mgba_bridge.lua
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pinballpokedex.app
        PRODUCT_NAME: PinballPokedex
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_LSApplicationCategoryType: "public.app-category.utilities"
        INFOPLIST_KEY_CFBundleDisplayName: "Pinball Pokédex"
        ENABLE_HARDENED_RUNTIME: NO
        COMBINE_HIDPI_IMAGES: NO
